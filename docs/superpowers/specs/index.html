<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Neural Dynamics — 3D Redesign + Prompt Editor Spec</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-dark.min.css" />
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #0b0b0d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .markdown-body {
    box-sizing: border-box;
    max-width: 920px;
    margin: 0 auto;
    padding: 48px 56px 96px;
    background: #0b0b0d;
  }
  .markdown-body h1 { border-bottom: 1px solid #1f1f22; padding-bottom: 12px; }
  .markdown-body a { color: #f5a524; }
  .markdown-body code { background: #17171a; }
  .markdown-body pre { background: #0f0f11; border: 1px solid #1f1f22; }
  .markdown-body table { display: table; width: 100%; }
  .markdown-body th { background: #141417; }
  .top-bar {
    position: sticky; top: 0; z-index: 10;
    background: #0b0b0db3; backdrop-filter: blur(8px);
    border-bottom: 1px solid #1f1f22;
    padding: 12px 24px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px; color: #9a9a9a;
    display: flex; justify-content: space-between; gap: 16px;
  }
  .top-bar .accent { color: #f5a524; }
  @media (max-width: 640px) {
    .markdown-body { padding: 32px 20px 64px; }
  }
</style>
</head>
<body>
<div class="top-bar">
  <span><span class="accent">neural-dynamics</span> / docs / superpowers / specs</span>
  <span id="rendered-at"></span>
</div>
<article class="markdown-body" id="content">Loading…</article>
<script>
  const file = '2026-04-16-neural-dynamics-3d-redesign-and-prompt-editor-design.md';
  fetch(file)
    .then(r => r.text())
    .then(md => {
      document.getElementById('content').innerHTML = marked.parse(md);
      document.getElementById('rendered-at').textContent =
        new Date().toLocaleString();
    })
    .catch(e => {
      document.getElementById('content').textContent = 'Failed to load: ' + e;
    });
</script>
</body>
</html>
