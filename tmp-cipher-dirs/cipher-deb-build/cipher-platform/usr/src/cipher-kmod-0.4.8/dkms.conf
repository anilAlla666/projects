# DKMS configuration for the CIPHER kernel module.
# CP 2.5 Decision 3(ii): ship kmod as a DKMS source package so it rebuilds
# against whatever kernel the node runs (the fleet is not guaranteed
# homogeneous on 6.8.0-1046-nvidia).
PACKAGE_NAME="cipher-kmod"
PACKAGE_VERSION="0.4.8"

# The out-of-tree Makefile drives kbuild: `make -C $KDIR M=$PWD modules`.
# DKMS runs MAKE[0] inside the per-version build tree (PWD = build dir);
# kernel_source_dir is DKMS's path to the target kernel's build tree.
MAKE[0]="make KDIR=${kernel_source_dir}"
CLEAN="make clean KDIR=${kernel_source_dir}"

BUILT_MODULE_NAME[0]="cipher_kmod"
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"
