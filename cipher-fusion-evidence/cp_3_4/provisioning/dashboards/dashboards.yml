# CP 3.4 — Grafana dashboard provider (auto-provisioned).
apiVersion: 1

providers:
  - name: cipher
    orgId: 1
    folder: CIPHER
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
