# CP 3.4 — Grafana ClickHouse datasource (auto-provisioned).
apiVersion: 1

datasources:
  - name: ClickHouse
    uid: cipher-ch
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: 127.0.0.1          # ClickHouse shares the host net namespace
