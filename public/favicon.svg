<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Neural Network Connections -->
  <g stroke-linecap="round" stroke-width="24">
    <!-- Main central connections -->
    <line x1="120" y1="380" x2="256" y2="120" stroke="#FF8C00" />
    <line x1="392" y1="380" x2="256" y2="120" stroke="#FF4444" />
    <line x1="120" y1="380" x2="392" y2="380" stroke="#FF6622" />
    
    <!-- Inner connections -->
    <line x1="256" y1="120" x2="256" y2="280" stroke="#FF4444" />
    <line x1="120" y1="380" x2="256" y2="280" stroke="#FF8C00" />
    <line x1="392" y1="380" x2="256" y2="280" stroke="#FF4444" />
    
    <!-- Outer peripheral connections -->
    <line x1="256" y1="120" x2="80" y2="200" stroke="#FF8C00" />
    <line x1="256" y1="120" x2="432" y2="200" stroke="#FF4444" />
    <line x1="80" y1="200" x2="120" y2="380" stroke="#FF8C00" />
    <line x1="432" y1="200" x2="392" y2="380" stroke="#FF4444" />
    
    <!-- Cross connections -->
    <line x1="80" y1="200" x2="256" y2="280" stroke="#FF6622" opacity="0.8" />
    <line x1="432" y1="200" x2="256" y2="280" stroke="#FF4444" opacity="0.8" />
  </g>

  <!-- Neural Nodes -->
  <g>
    <!-- Top Node -->
    <circle cx="256" cy="120" r="40" fill="#FF4444" />
    
    <!-- Center Node -->
    <circle cx="256" cy="280" r="35" fill="#FF6622" />
    
    <!-- Bottom Nodes -->
    <circle cx="120" cy="380" r="35" fill="#FF8C00" />
    <circle cx="392" cy="380" r="35" fill="#FF4444" />
    
    <!-- Side Nodes -->
    <circle cx="80" cy="200" r="30" fill="#FF8C00" />
    <circle cx="432" cy="200" r="30" fill="#FF4444" />
  </g>
</svg>